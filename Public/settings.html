<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office Desk | Access Management</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style/style.css" rel="stylesheet"></head>
<body class="app-page"><main class="container-fluid px-4 py-4"><div class="d-flex flex-wrap justify-content-between align-items-end mb-4"><div><span class="eyebrow text-primary">SYSTEM SETTINGS</span><h1 class="mt-2 mb-1">Access management</h1><p class="text-secondary mb-0">Control roles, pages, and workspace users.</p></div></div>
<ul class="nav nav-pills mb-3" id="accessTabs"><li class="nav-item"><button class="nav-link active" data-view="roles">Roles</button></li><li class="nav-item"><button class="nav-link" data-view="users">Users</button></li></ul>
<section id="rolesView" class="content-panel"><div class="panel-header"><div><h2>Roles</h2><p>Define who can access each page.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#roleModal" id="addRoleButton">+ Add role</button></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Role name</th><th>Users</th><th>Pages assigned</th><th class="text-end">Action</th></tr></thead><tbody id="roleRows"></tbody></table></div></section>
<section id="usersView" class="content-panel d-none"><div class="panel-header"><div><h2>Users</h2><p>Manage login accounts and assigned roles.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" id="addUserButton">+ Add user</button></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Username</th><th>Employee</th><th>Role</th><th>Status</th><th class="text-end">Action</th></tr></thead><tbody id="userRows"></tbody></table></div></section></main>
<div class="modal fade" id="roleModal" tabindex="-1"><div class="modal-dialog"><form id="roleForm" class="modal-content"><div class="modal-header"><h5 class="modal-title" id="roleModalTitle">Add role</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Role name</label><input id="roleName" class="form-control" required></div><div class="modal-footer"><button type="submit" class="btn btn-primary">Save role</button></div></form></div></div>
<div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog"><form id="userForm" class="modal-content"><div class="modal-header"><h5 class="modal-title" id="userModalTitle">Add user</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Username</label><input id="userNameInput" class="form-control mb-3" required><label class="form-label">Password</label><input id="userPassword" type="password" class="form-control mb-3"><label class="form-label">Role</label><select id="userRole" class="form-select mb-3" required></select><label class="form-label">Status</label><select id="userStatus" class="form-select"><option>ACTIVE</option><option>INACTIVE</option></select></div><div class="modal-footer"><button type="submit" class="btn btn-primary">Save user</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/access.js"></script><script src="/js/sidebar.js"></script></body></html>
