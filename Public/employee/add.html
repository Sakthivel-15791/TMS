<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office Desk | Add Employee</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style/style.css" rel="stylesheet"></head><body class="app-page"><main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-end mb-4"><div><span class="eyebrow text-primary">PEOPLE DIRECTORY</span><h1 class="mt-2 mb-1">Add employee</h1><p class="text-secondary mb-0">Create an employee and their login account.</p></div><a href="/employee/emp.html" class="btn btn-outline-secondary">Back to employees</a></div><form id="addEmployeeForm" class="content-panel"><h5>Employee Details</h5><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Employee Name *</label><input name="name" class="form-control" required></div><div class="col-md-3"><label class="form-label">DOB</label><input name="dob" type="date" class="form-control"></div><div class="col-md-3"><label class="form-label">Employee Image URL</label><input name="image_url" class="form-control"></div><div class="col-md-6"><label class="form-label">Email ID *</label><input name="email" type="email" class="form-control" required></div><div class="col-md-3"><label class="form-label">Primary Mobile No</label><input name="phone" class="form-control"></div><div class="col-md-3"><label class="form-label">Secondary Mobile No</label><input name="secondary_phone" class="form-control"></div><div class="col-md-6"><label class="form-label">Qualification</label><input name="qualification" class="form-control"></div></div><h5 class="mt-4">Address</h5><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Address Line</label><input name="address_line" class="form-control"></div><div class="col-md-3"><label class="form-label">City</label><input name="city" class="form-control"></div><div class="col-md-3"><label class="form-label">Post</label><input name="post" class="form-control"></div><div class="col-md-6"><label class="form-label">State</label><input name="state" class="form-control"></div><div class="col-md-3"><label class="form-label">Pin code</label><input name="pin_code" class="form-control"></div></div><h5 class="mt-4">Official Info</h5><div class="row g-3 mt-1"><div class="col-md-4"><label class="form-label">Department</label><select name="department_id" id="department" class="form-select"></select></div><div class="col-md-4"><label class="form-label">Designation</label><input name="designation" class="form-control"></div><div class="col-md-4"><label class="form-label">Employee ID *</label><input name="employee_code" class="form-control" required></div><div class="col-md-4"><label class="form-label">Role *</label><select name="role_id" id="role" class="form-select" required></select></div><div class="col-md-4"><label class="form-label">Default password</label><input class="form-control" value="12345" disabled></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a href="/employee/emp.html" class="btn btn-outline-secondary">Cancel</a><button class="btn btn-primary" type="submit">Create employee</button></div><div id="formError" class="alert alert-danger d-none mt-3"></div></form></main><script src="/js/employee-add.js"></script><script src="/js/sidebar.js"></script></body></html>
