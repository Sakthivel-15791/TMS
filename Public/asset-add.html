<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office Desk | Add Asset</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style/style.css" rel="stylesheet"></head><body class="app-page"><main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-end mb-4"><div><span class="eyebrow text-primary">INVENTORY</span><h1 class="mt-2 mb-1">Add asset</h1><p class="text-secondary mb-0">Register a company asset.</p></div><a href="/assets.html" class="btn btn-outline-secondary">Back to assets</a></div><form id="assetForm" class="content-panel"><div class="row g-3"><div class="col-md-6"><label class="form-label">Asset Name *</label><input name="asset_name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Asset Serial No *</label><input name="serial_no" class="form-control" required></div><div class="col-md-4"><label class="form-label">Asset Type *</label><select name="asset_type" class="form-select" required><option value="">Select type</option><option>Laptop</option><option>Desktop</option><option>Firewall</option><option>Camera</option><option>Mobile</option><option>Tablet</option><option>Server</option><option>Software Package</option></select></div><div class="col-md-4"><label class="form-label">Make</label><input name="make" class="form-control"></div><div class="col-md-4"><label class="form-label">Model</label><input name="model" class="form-control"></div><div class="col-md-4"><label class="form-label">Year of Purchase</label><input name="year_of_purchase" type="number" min="1900" max="2100" class="form-control"></div><div class="col-md-4"><label class="form-label">Purchased From</label><input name="purchased_from" class="form-control"></div><div class="col-md-4"><label class="form-label">Price</label><input name="price" type="number" min="0" step="0.01" class="form-control"></div></div><div class="text-end mt-4"><button class="btn btn-primary">Save asset</button></div><div id="assetError" class="alert alert-danger d-none mt-3"></div></form></main><script src="/js/asset-add.js"></script><script src="/js/sidebar.js"></script></body></html>
