<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office Desk | New Ticket</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style/style.css" rel="stylesheet"></head><body class="app-page"><main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-end mb-4"><div><span class="eyebrow text-primary">SERVICE DESK</span><h1 class="mt-2 mb-1">New ticket</h1><p class="text-secondary mb-0">Create a request for your department queue.</p></div><a href="/tickets/ticket.html" class="btn btn-outline-secondary">Back to my tickets</a></div><form id="newTicketForm" class="content-panel"><div class="row g-3"><div class="col-md-8"><label class="form-label">Title *</label><input name="title" class="form-control" required></div><div class="col-md-4"><label class="form-label">Priority</label><select name="priority" class="form-select"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>URGENT</option></select></div><div class="col-12"><label class="form-label">Description *</label><textarea name="description" rows="6" class="form-control" required></textarea></div><div class="col-md-6"><label class="form-label">Department</label><select name="department_id" id="ticketDepartment" class="form-select"></select></div><div class="col-md-6"><label class="form-label">Asset</label><select name="asset_id" id="ticketAsset" class="form-select"><option value="">No asset</option></select></div><div class="col-md-6"><label class="form-label">Due date</label><input name="due_date" id="ticketDueDate" type="date" class="form-control"></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a href="/tickets/ticket.html" class="btn btn-outline-secondary">Cancel</a><button type="submit" class="btn btn-primary">Create ticket</button></div><div id="ticketFormError" class="alert alert-danger d-none mt-3"></div></form></main><script src="/js/ticket-add.js"></script><script src="/js/sidebar.js"></script></body></html>
