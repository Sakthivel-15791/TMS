<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office Desk | Ticket Details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style/style.css" rel="stylesheet"></head><body class="app-page"><main class="container-fluid px-4 py-4"><div class="d-flex flex-wrap justify-content-between align-items-end mb-4"><div><span class="eyebrow text-primary">SERVICE DESK</span><h1 id="ticketTitle" class="mt-2 mb-1">Ticket details</h1><p id="ticketMeta" class="text-secondary mb-0"></p></div><div class="d-flex gap-2"><button id="closeTicket" class="btn btn-danger">Close ticket</button><a href="/tickets/ticket.html" class="btn btn-outline-secondary">Back to tickets</a></div></div><ul class="nav nav-tabs mb-4" id="ticketTabs"><li class="nav-item"><button class="nav-link active" data-tab="information">Information</button></li><li class="nav-item"><button class="nav-link" data-tab="notes">Notes</button></li><li class="nav-item"><button class="nav-link" data-tab="history">History</button></li></ul><section id="informationTab" class="ticket-tab content-panel"><div id="ticketInformation" class="row g-3"></div><div class="border-top mt-4 pt-4"><h5>Manage ticket</h5><div class="row g-3"><div class="col-md-5"><label class="form-label">Assign to user</label><select id="assignUser" class="form-select"></select></div><div class="col-md-5"><label class="form-label">Assign to department</label><select id="assignDepartment" class="form-select"></select></div><div class="col-md-2 d-flex align-items-end"><button id="assignTicket" class="btn btn-primary w-100">Assign</button></div></div></div></section><section id="notesTab" class="ticket-tab content-panel d-none"><div class="panel-header"><div><h2>Notes</h2><p>Notes added by users with system timestamps.</p></div><button id="addNote" class="btn btn-primary">Add Notes</button></div><div class="table-responsive"><table class="table"><thead><tr><th>Note</th><th>Flag</th><th>Added on</th><th>Added by</th></tr></thead><tbody id="noteRows"></tbody></table></div></section><section id="historyTab" class="ticket-tab content-panel d-none"><h2>History</h2><p class="text-secondary">Ticket activity timeline.</p><div id="historyTimeline" class="timeline"></div></section></main><div class="modal fade" id="noteModal" tabindex="-1"><div class="modal-dialog"><form id="noteForm" class="modal-content"><div class="modal-header"><h5 class="modal-title">Add Notes</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Notes</label><textarea name="comment" rows="4" class="form-control mb-3" required></textarea><label class="form-label">Flag</label><select name="note_flag" class="form-select"><option>IMPORTANT</option><option selected>MESSAGE</option><option>UPDATE</option><option>WARNING</option></select></div><div class="modal-footer"><button class="btn btn-primary" type="submit">Save note</button></div></form></div></div><div class="modal fade" id="closeModal" tabindex="-1"><div class="modal-dialog"><form id="closeForm" class="modal-content"><div class="modal-header"><h5 class="modal-title">Close ticket</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Notes</label><textarea name="notes" rows="3" class="form-control mb-3" placeholder="What was completed?" required></textarea><label class="form-label">Remarks</label><textarea name="remarks" rows="3" class="form-control" placeholder="Additional remarks"></textarea></div><div class="modal-footer"><button class="btn btn-danger" type="submit">Close ticket</button></div></form></div></div><div class="modal fade" id="assetInfoModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Asset information</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div id="assetInfoPopup" class="modal-body"></div></div></div></div><div class="modal fade" id="ownerInfoModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Owner information</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div id="ownerInfoPopup" class="modal-body"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/ticket-details.js"></script><script src="/js/sidebar.js"></script></body></html>
