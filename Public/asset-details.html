<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office Desk | Asset Details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style/style.css" rel="stylesheet"></head><body class="app-page"><main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-end mb-4"><div><span class="eyebrow text-primary">INVENTORY</span><h1 id="assetTitle" class="mt-2 mb-1">Asset details</h1><p id="assetMeta" class="text-secondary mb-0"></p></div><a href="/assets.html" class="btn btn-outline-secondary">Back to assets</a></div><ul class="nav nav-tabs mb-4"><li class="nav-item"><button class="nav-link active" data-tab="info">Asset Info</button></li><li class="nav-item"><button class="nav-link" data-tab="tickets">Tickets</button></li><li class="nav-item"><button class="nav-link" data-tab="assign">Assign Asset</button></li></ul><section id="infoTab" class="asset-tab content-panel"><div id="assetInfo" class="row g-3"></div></section><section id="ticketsTab" class="asset-tab content-panel d-none"><h2>Asset tickets</h2><div class="table-responsive"><table class="table"><thead><tr><th>Ticket no</th><th>Assigned on</th><th>Completed at</th><th>Status</th><th>Assigned to</th><th>View</th></tr></thead><tbody id="assetTicketRows"></tbody></table></div></section><section id="assignTab" class="asset-tab content-panel d-none"><div class="panel-header"><div><h2>Assign Asset</h2><p>Review ownership history and assign this asset.</p></div><button id="assignAssetButton" class="btn btn-primary">Assign asset</button></div><div class="table-responsive"><table class="table"><thead><tr><th>Owner</th><th>Department</th><th>From</th><th>To</th><th>Assigned by</th></tr></thead><tbody id="assignmentRows"></tbody></table></div></section></main><div class="modal fade" id="assignModal" tabindex="-1"><div class="modal-dialog"><for
